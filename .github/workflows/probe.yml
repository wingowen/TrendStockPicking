name: probe-list

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: 直接调用 fetch_data.list_get
        run: |
          cd backtest
          python3 - <<'PY'
          import urllib.request
          import fetch_data as f
          print("hosts:", f.LIST_HOSTS, "current:", f._list_host)
          for pz in (5, 100):
              path = f.LIST_PATH.replace("pz=100", "pz=%d" % pz)
              for host in f.LIST_HOSTS:
                  url = host + path.format(pn=1)
                  try:
                      r = urllib.request.urlopen(urllib.request.Request(
                          url, headers={"User-Agent": f.UA, "Referer": "https://quote.eastmoney.com/"}),
                          timeout=20)
                      print("pz=%d %s -> %s %s %dB" % (pz, host, r.status, r.geturl(), len(r.read())))
                  except Exception as e:
                      print("pz=%d %s -> ERR %s %s" % (pz, host, type(e).__name__, e))
          try:
              d = f.list_get(1)
              print("list_get OK total", d["data"]["total"], "rows", len(d["data"]["diff"]))
          except Exception as e:
              print("list_get ERR", type(e).__name__, e)
          try:
              uni = f.fetch_universe()
              print("universe OK", len(uni), uni[0])
          except Exception as e:
              print("universe ERR", type(e).__name__, e)
          PY
