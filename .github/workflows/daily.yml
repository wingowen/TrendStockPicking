name: daily-panel

on:
  schedule:
    # GitHub cron 用 UTC：07:20 UTC = 15:20 北京时间，收盘数据已落地
    - cron: "20 7 * * 1-5"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: daily-panel
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      TZ: Asia/Shanghai
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 抓数 + 生成面板
        run: bash ci_build.sh

      - name: 打包静态站点
        run: |
          set -e
          mkdir -p site/backtest
          cp breakout-panel.html rules.html echarts.min.js breakout-data.js site/
          cp -r breakout-data site/
          cp backtest/equity_data.js site/backtest/
          du -sh site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
